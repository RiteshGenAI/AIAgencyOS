# Production deployment compose file.
# All services are built inline; no separate Dockerfiles are required.
# The frontend is served by Nginx on port 80 and proxies /api/* to the backend.
#
# ⚠️  SECURITY WARNING:
# Before deploying, set BACKEND_SECRET_KEY and POSTGRES_PASSWORD to strong random values, e.g.:
#   export POSTGRES_PASSWORD=$(openssl rand -hex 32)
#   export BACKEND_SECRET_KEY=$(openssl rand -hex 32)
# In production, also set BACKEND_SEED_ADMIN=false and create the first user securely.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agency_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-agency_os}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agency_os} -d ${POSTGRES_DB:-agency_os}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agency_os

  backend:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        ENV PYTHONUNBUFFERED=1
        COPY backend/requirements.txt /tmp/requirements.txt
        RUN pip install --no-cache-dir -r /tmp/requirements.txt
        COPY backend /app/backend
        CMD ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      BACKEND_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agency_os}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agency_os}
      BACKEND_SECRET_KEY: ${BACKEND_SECRET_KEY:?BACKEND_SECRET_KEY is required}
      BACKEND_ENV: cloud
      BACKEND_SEED_ADMIN: ${BACKEND_SEED_ADMIN:-false}
      BACKEND_AGENTS_SERVICE_URL: http://agents:8081
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - agency_os

  agents:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        ENV PYTHONUNBUFFERED=1
        COPY agents/requirements.txt /tmp/requirements.txt
        RUN pip install --no-cache-dir -r /tmp/requirements.txt
        COPY agents /app/agents
        CMD ["uvicorn", "agents.app.main:app", "--host", "0.0.0.0", "--port", "8081"]
    restart: unless-stopped
    environment:
      STRANDS_SENTINEL_BASE_URL: http://backend:8000/internal/sentinel
      STRANDS_ENV: cloud
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agency_os

  frontend:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-alpine AS build
        WORKDIR /app
        COPY frontend/app/package.json frontend/app/package-lock.json* ./
        RUN npm install
        COPY frontend/app .
        RUN npm run build
        FROM nginx:1.27-alpine
        COPY --from=build /app/dist /usr/share/nginx/html
        COPY frontend/app/nginx.conf /etc/nginx/conf.d/default.conf
        EXPOSE 80
        CMD ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '80:80'
    networks:
      - agency_os

volumes:
  postgres_data:

networks:
  agency_os:
    driver: bridge
